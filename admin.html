<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#065f46">
<title>ছাদ ক্যাফে — অ্যাডমিন প্যানেল</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen">

<header class="bg-emerald-800 text-white p-4 shadow">
  <div class="max-w-3xl mx-auto flex justify-between items-center gap-3">
    <div>
      <h1 class="text-xl font-bold">🎋 ছাদ ক্যাফে</h1>
      <p class="text-xs text-emerald-200">অ্যাডমিন প্যানেল</p>
    </div>
    <button id="logout-btn" class="hidden bg-white/10 px-3 py-2 rounded-lg text-sm">
      লগআউট
    </button>
  </div>
</header>

<main class="max-w-3xl mx-auto p-4 space-y-5">

  <section id="login-section" class="bg-white border rounded-2xl p-5 max-w-md mx-auto mt-8">
    <h2 class="text-lg font-bold text-emerald-900 mb-1">অ্যাডমিন লগইন</h2>
    <p class="text-sm text-slate-500 mb-4">তোমার Supabase অ্যাকাউন্ট দিয়ে লগইন করো।</p>
    <form id="login-form" class="space-y-3">
      <input id="email" type="email" autocomplete="username" required
        placeholder="অ্যাডমিন ইমেইল"
        class="w-full border rounded-lg p-3 text-sm">
      <input id="password" type="password" autocomplete="current-password" required
        placeholder="পাসওয়ার্ড"
        class="w-full border rounded-lg p-3 text-sm">
      <button id="login-btn" type="submit"
        class="w-full bg-emerald-700 text-white rounded-lg p-3 font-bold">
        লগইন
      </button>
    </form>
    <p id="login-message" class="text-sm mt-3" role="status"></p>
  </section>

  <section id="dashboard" class="hidden space-y-5">

    <div class="bg-white border rounded-2xl p-4">
      <div class="flex justify-between items-center gap-2">
        <div>
          <h2 class="font-bold text-emerald-900">📦 অর্ডার ব্যবস্থাপনা</h2>
          <p id="order-count" class="text-xs text-slate-500 mt-1">অর্ডার লোড হচ্ছে...</p>
        </div>
        <button id="refresh-btn" class="bg-emerald-50 text-emerald-800 rounded-lg px-3 py-2 text-sm">
          ↻ রিফ্রেশ
        </button>
      </div>
      <p id="order-message" class="text-sm mt-3" role="status"></p>
    </div>

    <div id="orders-list" class="space-y-4">
      <p class="text-center text-slate-500 py-6">অর্ডার লোড হচ্ছে...</p>
    </div>

    <section class="bg-white border rounded-2xl p-4 space-y-3">
      <h2 class="font-bold text-emerald-900">📢 কাস্টমার পেজে নোটিশ</h2>
      <p class="text-xs text-slate-500">
        নোটিশ প্রকাশ করলে কাস্টমার পেজে দেখা যাবে, যদি site_notices টেবিল ও তার অনুমতি ঠিক থাকে।
      </p>
      <form id="notice-form" class="space-y-3">
        <input id="notice-title" required maxlength="150"
          placeholder="নোটিশের শিরোনাম"
          class="w-full border rounded-lg p-3 text-sm">
        <textarea id="notice-message" required rows="3"
          placeholder="নোটিশের বিস্তারিত লিখো"
          class="w-full border rounded-lg p-3 text-sm"></textarea>
        <button id="notice-btn" type="submit"
          class="w-full bg-emerald-700 text-white rounded-lg p-3 font-bold">
          নোটিশ প্রকাশ করুন
        </button>
      </form>
      <p id="notice-result" class="text-sm" role="status"></p>
    </section>

  </section>
</main>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://xkwjtaiuadzmvvkgeznw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_g1o6wnYpMSpYGi5x-ZCdaw_bD3KgN3W";

  const $ = id => document.getElementById(id);
  const STATUSES = {
    pending: "অপেক্ষমাণ",
    accepted: "অর্ডার গ্রহণ করা হয়েছে",
    preparing: "খাবার তৈরি হচ্ছে",
    ready: "খাবার প্রস্তুত",
    save: "সংরক্ষিত",
    cancelled: "বাতিল"
  };

  let db = null;
  let loading = false;

  function message(id, text, error = false) {
    $(id).textContent = text;
    $(id).className = "text-sm mt-3 " +
      (error ? "text-red-600" : "text-emerald-700");
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  function money(value) {
    return Number(value || 0).toLocaleString("en-BD");
  }

  function showDashboard(show) {
    $("login-section").classList.toggle("hidden", show);
    $("dashboard").classList.toggle("hidden", !show);
    $("logout-btn").classList.toggle("hidden", !show);
  }

  async function loadOrders() {
    if (!db || loading) return;
    loading = true;
    $("refresh-btn").disabled = true;
    $("orders-list").innerHTML =
      '<p class="text-center text-slate-500 py-6">অর্ডার লোড হচ্ছে...</p>';

    try {
      const { data: orders, error } = await db
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(100);

      if (error) throw error;

      if (!orders || orders.length === 0) {
        $("order-count").textContent = "এখনো কোনো অর্ডার নেই";
        $("orders-list").innerHTML =
          '<div class="bg-white border rounded-xl p-5 text-center text-slate-500">এখনো কোনো অর্ডার পাওয়া যায়নি।</div>';
        message("order-message", "");
        return;
      }

      $("order-count").textContent = "মোট " + orders.length + "টি সাম্প্রতিক অর্ডার";

      // অর্ডার আইটেম আলাদা করে আনা হচ্ছে, যাতে টেবিলে
      // সম্পর্কিত কলামের নামের পার্থক্যে পুরো তালিকা নষ্ট না হয়।
      let itemRows = [];
      const ids = orders.map(o => o.id);

      const { data: rows, error: itemError } = await db
        .from("order_items")
        .select("order_id,menu_name,quantity,unit_price")
        .in("order_id", ids);

      if (itemError) {
        console.warn("Order items:", itemError);
      } else {
        itemRows = rows || [];
      }

      $("orders-list").innerHTML = orders.map(order => {
        const items = itemRows.filter(row =>
          String(row.order_id) === String(order.id)
        );

        const itemsHtml = items.length
          ? items.map(item => `
              <div class="flex justify-between gap-3 text-sm py-1">
                <span>${esc(item.menu_name)} × ${esc(item.quantity)}</span>
                <span>৳${money(Number(item.unit_price) * Number(item.quantity))}</span>
              </div>`).join("")
          : '<p class="text-xs text-slate-500">খাবারের তালিকা পাওয়া যায়নি।</p>';

        const status = STATUSES[order.status] || order.status || "অজানা";

        return `
          <article class="bg-white border rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-start gap-3">
              <div>
                <h3 class="font-bold text-emerald-900">অর্ডার #${esc(order.id)}</h3>
                <p class="text-xs text-slate-500 mt-1">
                  ${esc(order.created_at ? new Date(order.created_at).toLocaleString("bn-BD") : "")}
                </p>
              </div>
              <span class="bg-emerald-50 text-emerald-800 rounded-full px-3 py-1 text-xs">
                ${esc(status)}
              </span>
            </div>

            <div class="grid grid-cols-2 gap-3 text-sm">
              <div class="bg-amber-50 rounded-lg p-3">
                <p class="text-xs text-slate-500">টেবিল</p>
                <p class="font-bold">${esc(order.table_number ?? "—")}</p>
              </div>
              <div class="bg-amber-50 rounded-lg p-3">
                <p class="text-xs text-slate-500">মোট টাকা</p>
                <p class="font-bold">৳${money(order.total)}</p>
              </div>
            </div>

            <div>
              <p class="text-xs text-slate-500 mb-1">কাস্টমার</p>
              <p class="text-sm">${esc(order.customer_nam || "নাম দেওয়া হয়নি")}</p>
            </div>

            ${order.note ? `
              <div>
                <p class="text-xs text-slate-500 mb-1">নোট / পেমেন্ট তথ্য</p>
                <p class="text-sm whitespace-pre-wrap">${esc(order.note)}</p>
              </div>` : ""}

            <div class="border-t pt-3">
              <p class="font-bold text-sm mb-2">খাবারের তালিকা</p>
              ${itemsHtml}
            </div>

            <div class="border-t pt-3 space-y-2">
              <label class="block text-xs font-bold">অর্ডারের অবস্থা পরিবর্তন</label>
              <select data-status-id="${esc(order.id)}"
                class="status-select w-full border rounded-lg p-3 text-sm">
                ${Object.entries(STATUSES).map(([key, label]) => `
                  <option value="${key}" ${order.status === key ? "selected" : ""}>
                    ${label}
                  </option>`).join("")}
              </select>
              <button data-save-id="${esc(order.id)}"
                class="save-status w-full bg-emerald-700 text-white rounded-lg p-3 text-sm font-bold">
                অবস্থা সেভ করুন
              </button>
              <p id="status-msg-${esc(order.id)}" class="text-xs" role="status"></p>
            </div>
          </article>`;
      }).join("");

      document.querySelectorAll(".save-status").forEach(button => {
        button.addEventListener("click", () => updateStatus(button.dataset.saveId));
      });

      message("order-message", "অর্ডার তালিকা হালনাগাদ হয়েছে।");

    } catch (error) {
      console.error("Load orders:", error);
      $("order-count").textContent = "অর্ডার লোড করা যায়নি";
      $("orders-list").innerHTML = `
        <div class="bg-red-50 border border-red-200 rounded-xl p-4">
          <p class="font-bold text-red-700">অর্ডার লোড হয়নি</p>
          <p class="text-sm text-red-600 mt-2">${esc(error.message || "অনুমতি বা সংযোগের সমস্যা")}</p>
        </div>`;
    } finally {
      loading = false;
      $("refresh-btn").disabled = false;
    }
  }

  async function updateStatus(orderId) {
    const select = document.querySelector(
      `[data-status-id="${CSS.escape(String(orderId))}"]`
    );
    if (!select) return;

    const newStatus = select.value;
    const button = document.querySelector(
      `[data-save-id="${CSS.escape(String(orderId))}"]`
    );
    button.disabled = true;
    const statusMsgId = "status-msg-" + orderId;

    try {
      const { data, error } = await db
        .from("orders")
        .update({ status: newStatus })
        .eq("id", orderId)
        .select("id,status");

      if (error) throw error;
      if (!data || data.length === 0) {
        throw new Error("অবস্থা বদলানো যায়নি। UPDATE অনুমতি বা RLS পলিসি পরীক্ষা করুন।");
      }

      $(statusMsgId).textContent = "অবস্থা সেভ হয়েছে: " +
        (STATUSES[data[0].status] || data[0].status);
      $(statusMsgId).className = "text-xs text-emerald-700";
      await loadOrders();

    } catch (error) {
      console.error("Update status:", error);
      $(statusMsgId).textContent = "সেভ হয়নি: " + (error.message || "ত্রুটি");
      $(statusMsgId).className = "text-xs text-red-600";
    } finally {
      button.disabled = false;
    }
  }

  $("refresh-btn").addEventListener("click", loadOrders);

  $("notice-form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = $("notice-btn");
    button.disabled = true;
    message("notice-result", "নোটিশ প্রকাশ করা হচ্ছে...");

    try {
      const title = $("notice-title").value.trim();
      const text = $("notice-message").value.trim();
      if (!title || !text) throw new Error("শিরোনাম ও বার্তা লিখতে হবে।");

      const { error } = await db.from("site_notices").insert({
        title: title,
        message: text,
        is_published: true
      });

      if (error) throw error;

      $("notice-title").value = "";
      $("notice-message").value = "";
      message("notice-result", "নোটিশ প্রকাশ হয়েছে।");
    } catch (error) {
      console.error("Notice publish:", error);
      message("notice-result",
        "নোটিশ প্রকাশ হয়নি: " + (error.message || "ত্রুটি"), true);
    } finally {
      button.disabled = false;
    }
  });

  $("login-form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = $("login-btn");
    button.disabled = true;
    $("login-message").textContent = "লগইন হচ্ছে...";

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) throw error;
      if (!data.session) throw new Error("লগইন সেশন পাওয়া যায়নি।");

      showDashboard(true);
      await loadOrders();

    } catch (error) {
      console.error("Login:", error);
      message("login-message",
        "লগইন হয়নি: " + (error.message || "ইমেইল বা পাসওয়ার্ড পরীক্ষা করুন।"), true);
    } finally {
      button.disabled = false;
    }
  });

  $("logout-btn").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();
    if (error) {
      alert("লগআউট হয়নি: " + error.message);
      return;
    }
    showDashboard(false);
    $("orders-list").innerHTML = "";
    $("password").value = "";
    $("login-message").textContent = "লগআউট হয়েছে।";
  });

  async function start() {
    if (!window.supabase) {
      message("login-message", "Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট পরীক্ষা করুন।", true);
      return;
    }

    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    try {
      const { data, error } = await db.auth.getSession();
      if (error) throw error;

      if (data.session) {
        showDashboard(true);
        await loadOrders();
      } else {
        showDashboard(false);
      }
    } catch (error) {
      console.error("Session:", error);
      showDashboard(false);
      message("login-message", "সেশন পরীক্ষা করা যায়নি: " + error.message, true);
    }
  }

  start();
})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ছাদ ক্যাফে | অ্যাডমিন</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f1e8;color:#24352a}
header{background:#234b35;color:white;padding:22px 12px;text-align:center}
main{max-width:800px;margin:auto;padding:15px}
button,select{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#28583d;color:white;cursor:pointer}
button:disabled{opacity:.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.order{background:white;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px #0001;overflow-wrap:anywhere}
.order h3{margin-top:0}
.status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status-row select{flex:1;min-width:150px}
#message{display:none;padding:12px;border-radius:8px;margin-bottom:12px;overflow-wrap:anywhere}
.muted{color:#666;font-size:13px}
</style>
</head>
<body>
<header>
<h2>🎋 ছাদ ক্যাফে</h2>
<div>অ্যাডমিন অর্ডার ম্যানেজমেন্ট</div>
</header>
<main>
<div class="top">
<div><strong>অর্ডার তালিকা</strong><div id="lastUpdate" class="muted">লোড হচ্ছে...</div></div>
<button id="refreshBtn">↻ রিফ্রেশ</button>
</div>
<div id="message"></div>
<div id="orders"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xkwjtaiuadzmvvkgeznw.supabase.co";
const SUPABASE_KEY = "sb_publishable_g1o6wnYpMSpYGi5x-ZCdaw_bD3KgN3W";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statuses = [
  {value:"pending",label:"অপেক্ষমাণ"},
  {value:"accepted",label:"অর্ডার গ্রহণ"},
  {value:"preparing",label:"তৈরি হচ্ছে"},
  {value:"ready",label:"প্রস্তুত"},
  {value:"save",label:"সংরক্ষিত"},
  {value:"cancelled",label:"বাতিল"}
];

const ordersBox = document.getElementById("orders");
const messageBox = document.getElementById("message");
let loading = false;

function showMessage(text,success=false){
  messageBox.style.display="block";
  messageBox.style.background=success?"#d9f3df":"#ffe2df";
  messageBox.style.color=success?"#18552b":"#8b1e17";
  messageBox.textContent=text;
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function labelFor(value){
  return statuses.find(s=>s.value===value)?.label || value || "অজানা";
}

async function loadOrders(){
  if(loading)return;
  loading=true;
  document.getElementById("refreshBtn").disabled=true;

  try{
    const {data,error}=await db
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});

    if(error)throw error;
    ordersBox.innerHTML="";

    if(!data || data.length===0){
      ordersBox.textContent="এখনও কোনো অর্ডার নেই।";
    }

    for(const order of (data||[])){
      const customer=order.customer_nam ?? order.customer_name ?? order.customer ?? "নাম দেওয়া হয়নি";
      const table=order.table_number ?? "উল্লেখ নেই";
      const date=order.created_at
        ?new Date(order.created_at).toLocaleString("bn-BD")
        :"সময় পাওয়া যায়নি";

      const card=document.createElement("section");
      card.className="order";

      const optionHTML=statuses.map(s=>
        `<option value="${s.value}" ${order.status===s.value?"selected":""}>${s.label}</option>`
      ).join("");

      card.innerHTML=`
        <h3>অর্ডার #${esc(order.id)}</h3>
        <p>👤 কাস্টমার: ${esc(customer)}</p>
        <p>🪑 টেবিল: ${esc(table)}</p>
        <p>📝 নোট: ${esc(order.note||"নেই")}</p>
        <p><strong>💰 মোট: ৳${esc(order.total??0)}</strong></p>
        <p>📌 বর্তমান স্ট্যাটাস: <strong>${esc(labelFor(order.status))}</strong></p>
        <p class="muted">${esc(date)}</p>
        <div class="status-row">
          <select class="statusSelect" aria-label="স্ট্যাটাস">${optionHTML}</select>
          <button class="updateBtn">স্ট্যাটাস বদলাও</button>
        </div>`;

      card.querySelector(".updateBtn").addEventListener("click",()=>{
        updateStatus(order.id,card);
      });

      ordersBox.appendChild(card);
    }

    document.getElementById("lastUpdate").textContent=
      "সর্বশেষ আপডেট: "+new Date().toLocaleTimeString("bn-BD");

  }catch(error){
    showMessage("অর্ডার লোড হয়নি: "+error.message);
  }finally{
    loading=false;
    document.getElementById("refreshBtn").disabled=false;
  }
}

async function updateStatus(orderId,card){
  const select=card.querySelector(".statusSelect");
  const button=card.querySelector(".updateBtn");
  const newStatus=select.value;

  if(!statuses.some(s=>s.value===newStatus)){
    showMessage("এই স্ট্যাটাস অনুমোদিত নয়।");
    return;
  }

  button.disabled=true;
  button.textContent="আপডেট হচ্ছে...";

  try{
    const {data,error}=await db
      .from("orders")
      .update({status:newStatus})
      .eq("id",orderId)
      .select("id,status");

    if(error)throw error;

    if(!data || data.length===0){
      throw new Error("অর্ডার আপডেট হয়নি। Supabase RLS/UPDATE অনুমতি পরীক্ষা করতে হবে।");
    }

    showMessage(
      "অর্ডার #"+orderId+" আপডেট হয়েছে: "+labelFor(newStatus),
      true
    );
    await loadOrders();

  }catch(error){
    showMessage("স্ট্যাটাস বদলানো যায়নি: "+error.message);
  }finally{
    button.disabled=false;
    button.textContent="স্ট্যাটাস বদলাও";
  }
}

document.getElementById("refreshBtn").addEventListener("click",loadOrders);
loadOrders();
setInterval(loadOrders,10000);
</script>
</body>
</html>

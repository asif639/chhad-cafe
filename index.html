<!DOCTYPE html>
<html lang="bn">
<head>
<link rel="manifest" href="./customer-manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#244c36">
<title>ছাদ ক্যাফে</title>
<style>
:root{--green:#244c36;--cream:#f7f5ef;--gold:#d6ad62}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:#263528;font-family:Arial,"Noto Sans Bengali",sans-serif}
header{background:var(--green);color:#fff;text-align:center;padding:28px 15px}
header h1{margin:0;font-size:30px}
header p{margin:9px 0 0;color:#e5eadf}
.container{max-width:1000px;margin:auto;padding:16px}
.section-title{margin:22px 0 14px;font-size:22px}
#menu{display:flex;flex-direction:column;gap:16px}
.food{display:flex;flex-direction:column;width:100%;background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 2px 8px #00000010}
.food img{display:block;width:100%;height:230px;object-fit:cover;background:#e6e6e6}
.food-info{padding:11px}
.food h3{margin:0 0 7px;font-size:17px}
.food p{font-size:13px;color:#666;margin:0 0 9px}
.price{font-weight:bold;color:var(--green);margin-bottom:10px}
button{border:0;border-radius:8px;padding:11px 13px;background:var(--green);color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.add{width:100%}
.panel{background:#fff;border-radius:13px;padding:16px;margin-top:22px;box-shadow:0 2px 8px #00000010}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:#fff}
textarea{resize:vertical}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:12px 0}
.qty{display:flex;align-items:center;gap:9px}
.qty button{padding:5px 11px}
.total{font-size:21px;font-weight:bold;text-align:right;margin:17px 0}
#orderBtn{width:100%;padding:14px;font-weight:bold}
#message{margin-top:14px;padding:12px;border-radius:8px;display:none;overflow-wrap:anywhere}
.empty{color:#777;text-align:center;padding:15px}
footer{text-align:center;padding:25px;color:#666;font-size:13px}
@media(min-width:650px){.food img{height:300px}}
</style>
</head>
<body>
<header>
  <h1>🌿 ছাদ ক্যাফে</h1>
  <p>ছাদের পরিবেশে, চায়ের কাপে প্রশান্তি</p>
</header>

<main class="container">
  <h2 class="section-title">🍽️ আমাদের মেনু</h2>
  <div id="menu"><p>মেনু লোড হচ্ছে...</p></div>

  <section class="panel" id="cartSection">
    <h2>🛒 তোমার অর্ডার</h2>
    <div id="cart"><p class="empty">এখনো কোনো খাবার যোগ করোনি।</p></div>
    <div class="total">মোট: ৳<span id="total">0</span></div>

    <form id="orderForm">
      <label for="customer">তোমার নাম *</label>
      <input id="customer" maxlength="100" required placeholder="নাম লিখো">

      <label for="table">টেবিল নম্বর *</label>
      <select id="table" required>
        <option value="">টেবিল বেছে নাও</option>
        <option value="1">টেবিল ১</option>
        <option value="2">টেবিল ২</option>
        <option value="3">টেবিল ৩</option>
        <option value="4">টেবিল ৪</option>
        <option value="5">টেবিল ৫</option>
      </select>

      <label for="note">বিশেষ নির্দেশনা (ঐচ্ছিক)</label>
      <textarea id="note" rows="3" maxlength="500" placeholder="যেমন: চায়ে চিনি কম"></textarea>

      <button id="orderBtn" type="submit" disabled>অর্ডার নিশ্চিত করো</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>

<footer>ছাদ ক্যাফে • ধন্যবাদ আমাদের সঙ্গে থাকার জন্য ❤️</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xkwjtaiuadzmvvkgeznw.supabase.co";
const SUPABASE_KEY = "sb_publishable_g1o6wnYpMSpYGi5x-ZCdaw_bD3KgN3W";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let menuItems = [];
let cart = [];

const menuEl = document.getElementById("menu");
const cartEl = document.getElementById("cart");
const totalEl = document.getElementById("total");
const messageEl = document.getElementById("message");
const orderBtn = document.getElementById("orderBtn");

function showMessage(text, success=false) {
  messageEl.style.display = "block";
  messageEl.style.background = success ? "#e1f5e5" : "#ffebee";
  messageEl.style.color = success ? "#205b32" : "#a32121";
  messageEl.textContent = text;
}
function money(value) {
  return Number(value).toLocaleString("en-BD",{maximumFractionDigits:2});
}
function renderMenu() {
  menuEl.innerHTML = "";
  if (!menuItems.length) {
    menuEl.innerHTML = "<p>এখন মেনুতে কোনো খাবার নেই। পরে আবার চেষ্টা করো।</p>";
    return;
  }
  menuItems.forEach(item => {
    const card = document.createElement("article");
    card.className = "food";
    const img = document.createElement("img");
    img.alt = item.name || "খাবারের ছবি";
    img.loading = "lazy";
    if (item.image_url) img.src = item.image_url;
    else img.style.display = "none";
    img.onerror = () => { img.style.display = "none"; };

    const info = document.createElement("div");
    info.className = "food-info";
    const name = document.createElement("h3");
    name.textContent = item.name || "খাবার";
    const description = document.createElement("p");
    description.textContent = item.description || "";
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = "৳" + money(item.price);
    const addBtn = document.createElement("button");
    addBtn.className = "add";
    addBtn.textContent = "＋ কার্টে যোগ করো";
    addBtn.addEventListener("click", () => addToCart(item.id));
    info.append(name,description,price,addBtn);
    card.append(img,info);
    menuEl.appendChild(card);
  });
}
function addToCart(id) {
  const item = menuItems.find(x => String(x.id) === String(id));
  if (!item) return;
  const existing = cart.find(x => String(x.id) === String(id));
  if (existing) {
    if (existing.quantity >= 99) { alert("একটি খাবারের সর্বোচ্চ পরিমাণ ৯৯টি।"); return; }
    existing.quantity++;
  } else {
    cart.push({...item,quantity:1});
  }
  renderCart();
}
function renderCart() {
  cartEl.innerHTML = "";
  if (!cart.length) cartEl.innerHTML = '<p class="empty">এখনো কোনো খাবার যোগ করোনি।</p>';
  let total = 0;
  cart.forEach(item => {
    total += Number(item.price) * item.quantity;
    const row = document.createElement("div");
    row.className = "cart-row";
    const details = document.createElement("div");
    details.textContent = item.name + " — ৳" + money(Number(item.price)*item.quantity);
    const controls = document.createElement("div");
    controls.className = "qty";
    const minus = document.createElement("button");
    minus.type = "button"; minus.textContent = "−";
    minus.setAttribute("aria-label",item.name+" কমাও");
    minus.onclick = () => changeQty(item.id,-1);
    const count = document.createElement("span");
    count.textContent = item.quantity;
    const plus = document.createElement("button");
    plus.type = "button"; plus.textContent = "+";
    plus.setAttribute("aria-label",item.name+" বাড়াও");
    plus.onclick = () => changeQty(item.id,1);
    controls.append(minus,count,plus);
    row.append(details,controls);
    cartEl.appendChild(row);
  });
  totalEl.textContent = money(total);
  orderBtn.disabled = cart.length === 0;
}
function changeQty(id,amount) {
  const item = cart.find(x => String(x.id) === String(id));
  if (!item) return;
  item.quantity += amount;
  if (item.quantity <= 0) cart = cart.filter(x => String(x.id) !== String(id));
  else if (item.quantity > 99) item.quantity = 99;
  renderCart();
}
async function loadMenu() {
  menuEl.innerHTML = "<p>মেনু লোড হচ্ছে...</p>";
  const {data,error} = await db.from("menu_items")
    .select("id,name,description,price,category,image_url,emoji")
    .eq("available",true)
    .order("sort_order",{ascending:true});
  if (error) {
    console.error(error);
    menuEl.innerHTML = "<p>মেনু লোড হয়নি। ইন্টারনেট ও Supabase-এর read policy পরীক্ষা করো।</p>";
    return;
  }
  menuItems = data || [];
  renderMenu();
  renderCart();
}
document.getElementById("orderForm").addEventListener("submit",async event => {
  event.preventDefault();
  messageEl.style.display = "none";
  if (!cart.length) { showMessage("প্রথমে কার্টে খাবার যোগ করো।"); return; }

  const customer = document.getElementById("customer").value.trim();
  const tableNumber = Number(document.getElementById("table").value);
  const noteText = document.getElementById("note").value.trim();

  if (!customer || ![1,2,3,4,5].includes(tableNumber)) {
    showMessage("নাম ও সঠিক টেবিল নম্বর দাও।"); return;
  }

  const items = cart.map(item => ({id:item.id,quantity:item.quantity}));
  orderBtn.disabled = true;
  orderBtn.textContent = "অর্ডার পাঠানো হচ্ছে...";

  try {
    const {data,error} = await db.rpc("place_cafe_order",{
      p_table_number:tableNumber,
      p_customer:customer,
      p_note:noteText,
      p_items:items
    });
    if (error) throw error;

    cart = [];
    renderCart();
    document.getElementById("orderForm").reset();
    showMessage("অর্ডার গ্রহণ করা হয়েছে! অর্ডার নম্বর: "+data+"। টাকা ক্যাফেতে সরাসরি পরিশোধ করবে।",true);
    messageEl.scrollIntoView({behavior:"smooth",block:"center"});
  } catch(error) {
    console.error(error);
    showMessage("অর্ডার পাঠানো যায়নি। ইন্টারনেট, SQL ফাংশন এবং Supabase সেটিংস পরীক্ষা করো। বিস্তারিত: "+(error.message||"অজানা সমস্যা"));
  } finally {
    orderBtn.disabled = cart.length === 0;
    orderBtn.textContent = "অর্ডার নিশ্চিত করো";
  }
});
loadMenu();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বাঁশের ক্যাফে — QR Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen pb-24">

  <header class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">☕</span>
      <div>
        <h1 class="text-xl font-bold">বাঁশের ক্যাফে</h1>
        <p class="text-xs text-emerald-200">গ্রাম্য স্বাদ, বাঁশের ঘ্রাণ</p>
      </div>
    </div>
    <div class="bg-emerald-900 text-emerald-100 text-xs px-2.5 py-1 rounded-full font-semibold border border-emerald-700 flex items-center space-x-1">
      <span>টেবিল:</span>
      <select id="table-select" onchange="changeTable()" class="bg-emerald-800 text-white font-bold rounded px-1 py-0.5 outline-none">
        <option value="1">১</option>
        <option value="2">২</option>
        <option value="3">৩</option>
        <option value="4">৪</option>
        <option value="5">৫</option>
        <option value="6">৬</option>
        <option value="7">৭</option>
        <option value="8">৮</option>
        <option value="9">৯</option>
        <option value="10">১০</option>
      </select>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">
    <div class="bg-gradient-to-r from-emerald-700 to-teal-800 text-white p-5 rounded-2xl shadow-sm">
      <h2 class="text-lg font-bold mb-1">আপনার পছন্দের খাবার অর্ডার করুন</h2>
      <p class="text-xs text-emerald-100">খাবার বাছাই করে ক্যাশ, বিকাশ বা নগদে অর্ডার দিন।</p>
    </div>

    <!-- Category Filters -->
    <div class="flex space-x-2 overflow-x-auto pb-1">
      <button onclick="filterCategory('সব')" class="bg-emerald-800 text-white px-4 py-1.5 rounded-full text-xs font-medium">সব</button>
      <button onclick="filterCategory('চা')" class="bg-white text-slate-700 border px-4 py-1.5 rounded-full text-xs font-medium">চা</button>
      <button onclick="filterCategory('নাশতা')" class="bg-white text-slate-700 border px-4 py-1.5 rounded-full text-xs font-medium">নাশতা</button>
    </div>

    <!-- Menu List -->
    <section>
      <h3 class="text-base font-bold mb-3 flex justify-between">
        <span>আমাদের মেনু</span>
        <span class="text-xs font-normal text-slate-500">(টাকা ৳)</span>
      </h3>
      <div id="menu-container" class="grid grid-cols-1 gap-3">
        <div class="text-center py-6 text-slate-400 text-xs">মেনু লোড হচ্ছে...</div>
      </div>
    </section>

    <!-- Cart & Payment -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-amber-100 space-y-4">
      <h3 class="text-base font-bold border-b pb-2 text-emerald-900">আপনার অর্ডার</h3>
      <div id="cart-items" class="space-y-2">
        <p class="text-xs text-slate-400 text-center py-2">এখনো কোনো খাবার যোগ করেননি</p>
      </div>

      <div class="border-t pt-3 flex justify-between items-center font-bold">
        <span>সর্বমোট:</span>
        <span class="text-emerald-700 text-lg">৳<span id="cart-total">0</span></span>
      </div>

      <div class="space-y-3 pt-2">
        <div>
          <label class="block text-xs text-slate-600 mb-1">আপনার নাম (ঐচ্ছিক):</label>
          <input type="text" id="cust-name" placeholder="যেমন: আসিফ" class="w-full text-xs p-2.5 bg-slate-50 border rounded-lg" />
        </div>
        <div>
          <label class="block text-xs text-slate-600 mb-1">বিশেষ নোটিশ (ঐচ্ছিক):</label>
          <input type="text" id="cust-note" placeholder="যেমন: চিনি কম দিবেন" class="w-full text-xs p-2.5 bg-slate-50 border rounded-lg" />
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">পেমেন্ট মাধ্যম:</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="border rounded-lg p-2 text-center cursor-pointer bg-slate-50 flex flex-col items-center">
              <input type="radio" name="payment" value="cash" checked onclick="togglePaymentInfo('cash')" class="mb-1">
              <span class="text-xs font-bold text-slate-700">ক্যাশ</span>
            </label>
            <label class="border rounded-lg p-2 text-center cursor-pointer bg-slate-50 flex flex-col items-center">
              <input type="radio" name="payment" value="bkash" onclick="togglePaymentInfo('bkash')" class="mb-1">
              <span class="text-xs font-bold text-pink-600">বিকাশ</span>
            </label>
            <label class="border rounded-lg p-2 text-center cursor-pointer bg-slate-50 flex flex-col items-center">
              <input type="radio" name="payment" value="nagad" onclick="togglePaymentInfo('nagad')" class="mb-1">
              <span class="text-xs font-bold text-orange-600">নগদ</span>
            </label>
          </div>
          <!-- পেমেন্ট নম্বর নোটিশ বক্স -->
          <div id="payment-info" class="mt-2 text-xs bg-emerald-50 text-emerald-800 p-2 rounded-lg border border-emerald-200 hidden">
            পেমেন্ট করুন: <strong class="text-emerald-900">01934408370</strong> (সেন্ড মানি করুন)
          </div>
        </div>

        <button onclick="submitOrder()" id="submit-btn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-md text-sm">
          অর্ডার কনফার্ম করুন
        </button>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://xkwjtaiuadzmvvkgeznw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_g1o6wnYpMSpYGi5x-ZCdaw_bD3KgN3W";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let menuItems = [];
    let cart = {};
    let currentCategory = 'সব';
    let tableNumber = 1;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('table')) {
      tableNumber = parseInt(urlParams.get('table')) || 1;
    }
    document.getElementById('table-select').value = tableNumber;

    function changeTable() {
      tableNumber = parseInt(document.getElementById('table-select').value);
    }

    function togglePaymentInfo(method) {
      const infoBox = document.getElementById('payment-info');
      if (method === 'bkash' || method === 'nagad') {
        infoBox.classList.remove('hidden');
        infoBox.innerHTML = `${method === 'bkash' ? 'বিকাশ' : 'নগদ'} সেন্ড মানি করুন: <strong class="text-emerald-900">01934408370</strong>`;
      } else {
        infoBox.classList.add('hidden');
      }
    }

    fetchMenuItems();

    async function fetchMenuItems() {
      try {
        const { data, error } = await supabase.from('menu_items').select('*').eq('available', true).order('sort_order');
        if (error) throw error;
        menuItems = data || [];
        renderMenu();
      } catch (err) {
        document.getElementById('menu-container').innerHTML = `<p class="text-red-500 text-xs text-center py-4">মেনু লোড করা সম্ভব হয়নি।</p>`;
      }
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      const filtered = currentCategory === 'সব' ? menuItems : menuItems.filter(item => item.category === currentCategory);
      
      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs text-center py-4">কোনো খাবার পাওয়া যায়নি</p>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">${item.emoji || '🍽️'}</span>
            <div>
              <h4 class="text-sm font-bold">${item.name}</h4>
              <p class="text-xs text-slate-400">${item.description || ''}</p>
              <span class="text-xs font-bold text-emerald-700">৳${item.price}</span>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            ${cart[item.id] ? `
              <button onclick="updateQty(${item.id}, -1)" class="w-7 h-7 rounded bg-slate-200 text-slate-800 font-bold">-</button>
              <span class="text-xs font-bold px-1">${cart[item.id]}</span>
              <button onclick="updateQty(${item.id}, 1)" class="w-7 h-7 rounded bg-emerald-700 text-white font-bold">+</button>
            ` : `
              <button onclick="updateQty(${item.id}, 1)" class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1.5 rounded-lg border border-emerald-200 font-bold">+ যোগ করুন</button>
            `}
          </div>
        </div>
      `).join('');
    }

    function updateQty(id, change) {
      const current = cart[id] || 0;
      const next = current + change;
      if (next <= 0) delete cart[id];
      else cart[id] = next;
      renderMenu();
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">এখনো কোনো খাবার যোগ করেননি</p>`;
        document.getElementById('cart-total').innerText = '0';
        return;
      }
      let total = 0, html = '';
      keys.forEach(id => {
        const item = menuItems.find(m => m.id == id);
        if (item) {
          const itemTotal = item.price * cart[id];
          total += itemTotal;
          html += `<div class="flex justify-between text-xs py-1"><span>${item.name} (x${cart[id]})</span><span class="font-bold">৳${itemTotal}</span></div>`;
        }
      });
      container.innerHTML = html;
      document.getElementById('cart-total').innerText = total;
    }

    function filterCategory(cat) {
      currentCategory = cat;
      renderMenu();
    }

    async function submitOrder() {
      const itemIds = Object.keys(cart);
      if (itemIds.length === 0) {
        alert('মেনু থেকে অন্তত একটি খাবার পছন্দ করুন।');
        return;
      }
      const name = document.getElementById('cust-name').value.trim();
      const note = document.getElementById('cust-note').value.trim();
      const payment = document.querySelector('input[name="payment"]:checked').value;

      const fullNote = `[পেমেন্ট: ${payment.toUpperCase()}] ${note}`;
      
      let totalAmount = 0;
      itemIds.forEach(id => {
        const item = menuItems.find(m => m.id == id);
        if (item) totalAmount += item.price * cart[id];
      });

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'অর্ডার পাঠানো হচ্ছে...';

      try {
        const { data: orderData, error: orderError } = await supabase
          .from('orders')
          .insert({
            table_number: tableNumber,
            customer_name: name || 'অতিথি',
            note: fullNote,
            total: totalAmount,
            status: 'pending'
          })
          .select()
          .single();

        if (orderError) throw orderError;

        const orderItemsPayload = itemIds.map(id => {
          const item = menuItems.find(m => m.id == id);
          return {
            order_id: orderData.id,
            menu_item_id: parseInt(id),
            menu_name: item ? item.name : 'খাবার',
            quantity: cart[id],
            unit_price: item ? item.price : 0
          };
        });

        const { error: itemsError } = await supabase
          .from('order_items')
          .insert(orderItemsPayload);

        if (itemsError) throw itemsError;

        alert(`আপনার অর্ডার সফলভাবে গ্রহণ করা হয়েছে! অর্ডার নম্বর: #${orderData.id}`);
        cart = {};
        document.getElementById('cust-name').value = '';
        document.getElementById('cust-note').value = '';
        renderMenu();
        renderCart();
      } catch (err) {
        alert('অর্ডার পাঠাতে সমস্যা হয়েছে: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'অর্ডার কনফার্ম করুন';
      }
    }
  </script>
</body>
</html>
